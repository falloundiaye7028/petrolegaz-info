<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appels d'offres — PétroleGaz Info</title>
<meta name="description" content="Toutes les opportunités du secteur pétrolier, gazier et minier au Sénégal.">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:#F8FAFC;color:#0F172A}header{background:#fff;border-bottom:1px solid #E2E8F0;padding:16px 24px;position:sticky;top:0;z-index:100}.nav{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:20px;font-weight:800;color:#0B3D91;text-decoration:none}.nav-links{display:flex;gap:20px;align-items:center}.nav-links a{color:#64748B;text-decoration:none;font-size:14px;font-weight:500}.btn-wa{background:#25D366!important;color:#fff!important;padding:10px 18px;border-radius:8px}.container{max-width:900px;margin:auto;padding:48px 24px}h1{font-size:36px;margin-bottom:12px}.subtitle{color:#64748B;margin-bottom:40px;font-size:17px}.ao-list{display:flex;flex-direction:column;gap:16px}.ao{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:24px;transition:.3s}.ao:hover{box-shadow:0 8px 20px rgba(0,0,0,.06);border-color:#0B3D91}.ao-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}.ao h3{font-size:18px}.ao-badge{padding:6px 12px;border-radius:50px;font-size:12px;font-weight:700;white-space:nowrap}.urgent{background:#FEE2E2;color:#991B1B}.normal{background:#FEF3C7;color:#92400E}.new{background:#DCFCE7;color:#166534}.closed{background:#E2E8F0;color:#475569}.ao p{color:#334155;font-size:14px;margin-bottom:16px;line-height:1.6}.ao-meta,.ao-tags{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}.ao-meta{gap:16px;font-size:13px;color:#64748B}.ao-tag{background:#E6EEFB;color:#0B3D91;font-size:11px;padding:4px 10px;border-radius:6px;font-weight:500}.btn-primary{display:inline-block;background:#0B3D91;color:#fff;padding:10px 20px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px}.empty,.loading{text-align:center;padding:80px 24px;color:#64748B;background:#fff;border-radius:12px}.empty-icon{font-size:48px;margin-bottom:16px}.spinner{display:inline-block;width:32px;height:32px;border:3px solid #E2E8F0;border-top-color:#0B3D91;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.counter{font-size:13px;color:#64748B;margin-bottom:24px;padding:12px 16px;background:#E6EEFB;border-radius:8px;border-left:4px solid #0B3D91}@media(max-width:640px){.nav-links a:not(.btn-wa){display:none}h1{font-size:26px}.container{padding:32px 20px}.ao-header{flex-direction:column}}
</style>
</head>
<body>
<header><div class="nav"><a href="index.html" class="logo">🛢️ PétroleGaz Info</a><div class="nav-links"><a href="annuaire.html">Annuaire</a><a href="appels-offres.html">Appels d'offres</a><a href="dashboard.html">Dashboard</a><a href="inscription.html" class="btn-wa">Inscrire ma PME</a></div></div></header>
<main class="container">
  <h1>Appels d'offres</h1>
  <p class="subtitle">Toutes les opportunités du secteur pétrolier, gazier et minier au Sénégal.</p>
  <div id="counter" class="counter" hidden></div>
  <div class="ao-list" id="ao-list"><div class="loading"><div class="spinner"></div><p style="margin-top:16px">Chargement des appels d'offres...</p></div></div>
</main>
<script>
const list = document.getElementById('ao-list');
const counter = document.getElementById('counter');
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function formatDate(value) {
  if (!value) return 'Non précisée';
  const [year, month, day] = value.slice(0, 10).split('-').map(Number);
  return new Date(year, month - 1, day).toLocaleDateString('fr-FR', {day:'numeric',month:'long',year:'numeric'});
}
function joursRestants(value) {
  if (!value) return null;
  const [year, month, day] = value.slice(0, 10).split('-').map(Number);
  const today = new Date();
  const startToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  return Math.ceil((new Date(year, month - 1, day) - startToday) / 86400000);
}
function badgeInfo(days, priority) {
  if (days === null) return {cls:'closed',text:'Date inconnue'};
  if (days < 0) return {cls:'closed',text:'Clôturé'};
  if (days === 0) return {cls:'urgent',text:"Aujourd'hui"};
  if (days <= 7) return {cls:'urgent',text:`J-${days}`};
  if (priority === 'Urgente' || days <= 15) return {cls:'normal',text:`J-${days}`};
  return {cls:'new',text:`J-${days}`};
}
async function loadAppelsOffres() {
  try {
    const response = await fetch('/api/appels-offres');
    if (!response.ok) throw new Error('Chargement impossible');
    const { appelsOffres = [] } = await response.json();
    if (!appelsOffres.length) {
      list.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><strong>Aucun appel d\'offres en cours</strong><p>Revenez dans quelques jours.</p></div>';
      return;
    }
    const urgentCount = appelsOffres.filter(ao => { const d=joursRestants(ao.cloture); return d!==null&&d>=0&&d<=7; }).length;
    counter.hidden = false;
    counter.innerHTML = `<strong>${appelsOffres.length}</strong> appel${appelsOffres.length>1?'s':''} d'offres en cours${urgentCount?` · <span style="color:#991B1B;font-weight:700">${urgentCount} urgent${urgentCount>1?'s':''}</span>`:''}`;
    list.innerHTML = appelsOffres.map(ao => {
      const badge=badgeInfo(joursRestants(ao.cloture),ao.priorite);
      const tags=(Array.isArray(ao.secteur)?ao.secteur:[]).map(s=>`<span class="ao-tag">${escapeHtml(s)}</span>`).join('');
      const message=encodeURIComponent(`Bonjour, je suis intéressé par l'appel d'offres : ${ao.titre}`);
      return `<article class="ao"><div class="ao-header"><h3>${escapeHtml(ao.titre)}</h3><span class="ao-badge ${badge.cls}">${badge.text}</span></div><p>${escapeHtml(ao.description)}</p>${tags?`<div class="ao-tags">${tags}</div>`:''}<div class="ao-meta"><span>🏢 ${escapeHtml(ao.donneur)}</span><span>📍 ${escapeHtml(ao.localisation)}</span><span>📅 Clôture : ${formatDate(ao.cloture)}</span>${ao.source?`<span>📋 ${escapeHtml(ao.source)}</span>`:''}</div><a href="https://wa.me/221778001717?text=${message}" target="_blank" rel="noopener noreferrer" class="btn-primary">Je suis intéressé →</a></article>`;
    }).join('');
  } catch (error) {
    console.error(error);
    list.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><strong>Impossible de charger les appels d\'offres</strong><p>Réessayez dans quelques instants.</p></div>';
  }
}
loadAppelsOffres();
</script>
</body>
</html>
